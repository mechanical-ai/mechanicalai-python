              to: { type: string, format: date-time }
              runs: { type: integer }
              cost_cents: { type: integer }
        by_end_user:
          type: object
          description: When `group_by` is end_user; runs without an `end_user` are in the totals only.
          additionalProperties:
            type: object
            required: [runs, cost_cents]
            properties:
              runs: { type: integer }
              cost_cents: { type: integer }
    Limits:
      type: object
      required: [object, projects_per_account, files_per_project, files_per_run, storage_bytes, concurrent_runs_per_key, requests_per_minute, upload_bytes_max, problem_chars_max, instructions_chars_max, usage]
      properties:
        object: { type: string, const: limits }
        projects_per_account: { type: integer }
        files_per_project: { type: integer }
        files_per_run: { type: integer }
        storage_bytes: { type: integer }
        concurrent_runs_per_key: { type: integer }
        requests_per_minute: { type: integer }
        upload_bytes_max: { type: integer }
        problem_chars_max: { type: integer }
        instructions_chars_max: { type: integer }
        usage:
          type: object
