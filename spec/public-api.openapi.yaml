        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RunEvent" }

    ArtifactKind:
      type: string
      enum: [report, document, model, table, data, image]
    Artifact:
      type: object
      required: [id, object, project_id, run_id, kind, name, formats, default_format, size, group, created_at]
      properties:
        id: { type: string }
        object: { type: string, const: artifact }
        project_id: { type: string }
        run_id: { type: string }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        name: { type: string }
        formats:
          type: array
