          description: "report: md, pdf, docx · document: md, pdf, docx · model: step, stl, glb, native (when the model has one) · table: csv, xlsx · data: vtu, csv, json · image: png"
        default_format: { type: string }
        size: { type: [integer, "null"], description: Bytes of the default format, when known. }
        group: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ArtifactList:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Artifact" }

    Usage:
      type: object
      required: [object, period, from, to, runs, cost_cents, buckets]
      properties:
        object: { type: string, const: usage }
        period: { type: string, enum: [day, month] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        runs: { type: integer }
        cost_cents: { type: integer }
        buckets:
