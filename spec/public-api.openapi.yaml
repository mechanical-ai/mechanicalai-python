            storage_bytes: { type: integer }
            running_runs: { type: integer }
            running_runs_this_key: { type: integer }

    WebhookEvent:
      type: object
      description: The body posted to `webhook_url` on a run's terminal transition.
      required: [id, object, type, created_at, data]
      properties:
        id: { type: string, examples: [wh_01jc5100] }
        object: { type: string, const: event }
        type: { type: string, enum: [run.succeeded, run.needs_input, run.budget_exhausted, run.failed, run.cancelled] }
        created_at: { type: string, format: date-time }
        data:
          type: object
          required: [run]
          properties:
            run: { $ref: "#/components/schemas/Run" }

