[project]
name = "mechanicalai"
version = "0.0.2"
description = "The official Python library for the Mechanical AI API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mechanical AI, Inc.", email = "contact@mechanicalai.com" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://mechanicalai.com"
Repository = "https://github.com/mechanical-ai/mechanicalai-python"
Issues = "https://github.com/mechanical-ai/mechanicalai-python/issues"

[project.scripts]
mechanicalai = "mechanicalai._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechanicalai"]
