[project]
name = "mechanicalai"
version = "0.0.2"
description = "The official Python library for the Mechanical AI API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mechanical AI, Inc.", email = "contact@mechanicalai.com" }]
keywords = ["mechanicalai", "mechanical", "engineering", "cad", "cae", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "anyio>=4",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://mechanicalai.com"
Repository = "https://github.com/mechanical-ai/mechanicalai-python"
Issues = "https://github.com/mechanical-ai/mechanicalai-python/issues"
Changelog = "https://github.com/mechanical-ai/mechanicalai-python/blob/main/CHANGELOG.md"

[project.scripts]
mechanicalai = "mechanicalai._cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechanicalai"]

[tool.hatch.build.targets.sdist]
include = ["src/mechanicalai", "tests", "spec", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mechanicalai", "tests"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
